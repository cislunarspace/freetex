name: Release

on:
  push:
    tags: ["v*"]

# 除创建 GitHub Release 外，其余 job 均只读取仓库内容。
# Everything except the release job only reads the repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: 校验发布元数据
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 校验 Tag 与版本
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash packaging/scripts/validate-release.sh

  test:
    name: Run tests (${{ matrix.os }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runs-on: ubuntu-22.04
          - os: windows
            runs-on: windows-latest
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: 安装 Linux 系统依赖
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Run tests
        run: cargo test --manifest-path=src-tauri/Cargo.toml --lib

  build-linux:
    name: 构建 Linux 软件包 (${{ matrix.arch }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runs-on: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - arch: arm64
            runs-on: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          workspaces: src-tauri -> target

      - name: 安装 Linux 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf rpm

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      # ort-sys 构建期自动下载 onnxruntime 预编译库（dist.tsv 覆盖 linux x64/aarch64）
      # ort-sys downloads onnxruntime prebuilts at build time (its dist.tsv covers linux x64/aarch64)
      - name: 构建 deb、rpm 与 AppImage
        run: npm --prefix frontend exec -- tauri build --target ${{ matrix.target }} --bundles deb,rpm,appimage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          APPIMAGE_EXTRACT_AND_RUN: "1"

      - name: 上传 Linux 软件包产物
        uses: actions/upload-artifact@v4
        with:
          name: freetex-linux-${{ matrix.arch }}-packages
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage.tar.gz*
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage.sig
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/latest.json
          if-no-files-found: warn

  build-windows:
    name: 构建 Windows 安装包 (${{ matrix.arch }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
          - arch: arm64
            target: aarch64-pc-windows-msvc
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          workspaces: src-tauri -> target

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: 构建 NSIS 安装包与 MSI
        run: npm --prefix frontend exec -- tauri build --target ${{ matrix.target }} --bundles nsis,msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      - name: 上传 Windows 安装包产物
        uses: actions/upload-artifact@v4
        with:
          name: freetex-windows-${{ matrix.arch }}-packages
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe.sig
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.nsis.zip*
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/latest.json
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi.zip*
          if-no-files-found: warn

  release:
    name: Create Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Write release notes from CHANGELOG
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash packaging/scripts/extract-release-notes.sh release_notes.md

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: 校验发布产物
        run: |
          mapfile -t debs < <(find release-assets -type f -name '*.deb' | sort)
          mapfile -t rpms < <(find release-assets -type f -name '*.rpm' | sort)
          mapfile -t appimages < <(find release-assets -type f -name '*.AppImage' | sort)
          mapfile -t exes < <(find release-assets -type f -name '*-setup.exe' | sort)
          mapfile -t msis < <(find release-assets -type f -name '*.msi' | sort)
          if [[ "${#debs[@]}" -ne 2 || "${#rpms[@]}" -ne 2 || "${#appimages[@]}" -ne 2 || "${#exes[@]}" -ne 2 || "${#msis[@]}" -ne 2 ]]; then
            echo "错误：预期两份 deb、两份 rpm、两份 AppImage、两份 exe 和两份 msi（x64 与 arm64 各一份），实际为 ${#debs[@]} 份 deb、${#rpms[@]} 份 rpm、${#appimages[@]} 份 AppImage、${#exes[@]} 份 exe、${#msis[@]} 份 msi" >&2
            find release-assets -type f | sort >&2
            exit 1
          fi
          printf '发布产物：\n%s\n' "$(find release-assets -type f | sort)"

      - name: Generate checksums
        run: |
          cd release-assets
          find . -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*-setup.exe' -o -name '*.msi' \) -print0 | sort -z | xargs -0 sha256sum > ../checksums.txt
          cd ..
          cat checksums.txt

      - name: 合并各平台 Updater 产物并生成 latest.json
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          bash packaging/scripts/merge-updater-json.sh release-assets release-assets/latest.json "${VERSION}" release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          files: |
            release-assets/**/*.deb
            release-assets/**/*.rpm
            release-assets/**/*.AppImage
            release-assets/**/*.AppImage.tar.gz
            release-assets/**/*.AppImage.tar.gz.sig
            release-assets/**/*.AppImage.sig
            release-assets/**/*-setup.exe
            release-assets/**/*-setup.exe.sig
            release-assets/**/*-setup.nsis.zip
            release-assets/**/*-setup.nsis.zip.sig
            release-assets/**/*.msi
            release-assets/**/*.msi.zip
            release-assets/**/*.msi.zip.sig
            checksums.txt
            release-assets/latest.json
