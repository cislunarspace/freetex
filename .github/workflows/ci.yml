name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Linux 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 前端依赖
        run: npm --prefix frontend ci
      - name: 前端构建
        run: npm --prefix frontend run build
      - name: 格式检查
        run: cargo fmt --manifest-path=src-tauri/Cargo.toml -- --check
      - name: Clippy
        run: cargo clippy --manifest-path=src-tauri/Cargo.toml -- -D warnings
      - name: 单元测试
        run: cargo test --manifest-path=src-tauri/Cargo.toml --lib

  check-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 前端依赖
        run: npm --prefix frontend ci
      - name: 单元测试
        run: cargo test --manifest-path=src-tauri/Cargo.toml --lib
      - name: 构建 NSIS 安装包
        # CI 只做打包回归检查：关闭 updater 产物，避免要求签名私钥
        # CI only checks packaging: disable updater artifacts so no signing key is needed
        run: npm --prefix frontend exec -- tauri build --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":false}}'
